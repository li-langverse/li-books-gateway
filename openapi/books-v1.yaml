openapi: 3.1.0
info:
  title: li-books API
  version: 1.0.0
  description: Agentic German bookkeeping — chat, parse, ledger, Elster-prep exports
paths:
  /v1/chat/messages:
    post:
      operationId: books_chat_turn
      summary: Chat turn (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                org_id: { type: string, format: uuid }
                book_id: { type: string, format: uuid }
  /v1/receipts/parse:
    post:
      operationId: books_submit_document
      summary: Parse OCR text; may trigger clarification
  /v1/receipts/post:
    post:
      operationId: books_confirm_posting
      summary: Post receipt to journal after user confirm
  /v1/clarifications:
    post:
      operationId: books_ask_clarification
      summary: Ask clarification question
  /v1/clarifications/{id}/answer:
    post:
      operationId: books_answer_clarification
      summary: Answer clarification
  /v1/law/search:
    post:
      operationId: books_law_search
      summary: Law corpus RAG search
  /v1/tax/summary:
    get:
      operationId: books_tax_summary
      summary: Period tax rollup (UStVA prep)
  /v1/bank/import:
    post:
      summary: Import bank CSV
  /v1/export/csv:
    get:
      summary: Journal CSV export
  /v1/export/datev:
    get:
      summary: DATEV EXTF export
  /v1/export/elster/ustva:
    get:
      summary: UStVA Elster-prep XML (M1)
  /v1/export/elster/eur:
    get:
      summary: EÜR Elster-prep XML (M1)
  /v1/onboarding/signup:
    post:
      summary: Org + book signup wizard (Stripe stub)
  /v1/agent/tools:
    get:
      summary: List agent tool operationIds
  /v1/crypto/sources:
    get:
      summary: List registered crypto sync adapters (enabled + planned)
  /v1/crypto/sync:
    post:
      operationId: books_crypto_sync
      summary: Sync crypto transactions from registered sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id, tax_year]
              properties:
                book_id: { type: string, format: uuid }
                tax_year: { type: integer }
                sources:
                  type: array
                  items:
                    type: string
                    enum: [csv, binance, okx, eth_wallet, kraken, coinbase, bybit]
                  description: MVP enabled — binance, okx, csv, eth_wallet. kraken/coinbase/bybit are planned stubs.
                source:
                  type: string
                  description: Legacy single source (same enum as sources[])
                csv: { type: string, description: Required when sources includes csv }
                wallet_address: { type: string, description: ETH address when sources includes eth_wallet }
  /v1/crypto/timeline:
    get:
      operationId: books_crypto_tax_timeline
      summary: Minute-granularity crypto tax timeline (requires year unlock)
      parameters:
        - { name: book_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: tax_year, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
